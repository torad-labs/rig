# glm5next (MLA + KDA recurrent layers, 288 experts) runs on the fork after the global pin: the
# routed experts' ring (b8d44d4b8), the SwiGLU limit's fused clamp (640a12c41), ssm_a on the card
# (bb0e005fd), the KDA and DSA layers split by head under -sm tensor (1f004c9e4, PR #79), and the
# whole-evaluation CUDA graph, the hyper-connection kernels, the shared q8_1 input and KDA's q, k, v
# as one launch (0eb0464ad, PR #81); ba0e6ec26 is 0eb0464ad and the PDL restrict fix, nothing else.
# 2e699cceb is ba0e6ec26 and what came after on the same line (TORAD.md has each row): the hyper-connection front by
# the streams' Gram matrix, its comb in registers and on a side stream, and its q8_1 copy written in place of a quantize
# launch, 16-byte small mat-vecs, KDA's raw gates, joint l2, conv order, f16 state write and conv weights read in place, the
# MoE ring's vectors in shared memory, its ids before the PDL wait, its pairs decoded once, the fused top-k at 2-4 rows,
# the routed experts' weighted sum in one launch, the meta buffers' usage, the paced L2 issuer, the two-card all-reduce as
# LL packets under 16 KB; the rerun box measured it on the cards (evidence.md).
# 9c506a40d is 2e699cceb and what came after on the same line (TORAD.md has each row): the routed-expert ring's pair
# offsets from host tables and its pairs decoded once only where they are as many as the experts, a float mat-mul mmf
# would underfill on the vector kernel, the hyper-connection comb beside the stream removed, the pooled-indexer inputs
# following the cells that changed, sparse flash attention over the cells a DSA layer selected, a scatter's rows made
# unique, the meta backend mirroring a node with no sources, and every warp of the MMA flash-attention combine reaching
# one barrier.
# e11e67c29 is 9c506a40d and what came after on the same line (TORAD.md has each row): the sparse mask's scan reading
# 32768 columns a round, the lightning indexer reading pooled keys in place on a quad of lanes, the routed-expert ring
# quantizing its own down-projection vectors, the one-launch hyper-connection front kept opt-in (it measured slower than
# the two kernels), and the sparse mask's filler slots taken from dump pools in the top-k instead of a liveness chain in
# every DSA layer. It is the next rental's engine, gated on the 44-layer proxy and not yet on the cards; the rental A/Bs
# it against 2e699cceb, the engine the cards last measured, and the pin moves back if the cards say it is slower.
# 765692590 is e11e67c29 and what came after on the same line (TORAD.md has each row): three prefill changes that are bit
# for bit against their parents, each with a mutant that differs -- KDA's output norm a warp to a row and the hc norm
# writing cuBLAS's BF16 operand (+4.40 % pp4096 on the cards), and KDA's decay computed once a token ahead of the
# recurrence (-1.0 % device time); plus measuring legs that change no kernel (LLAMA_TIME_DECODE, GGML_CUDA_TIME_LAUNCH,
# dKLD by position with same-top beside it). The pin deliberately stops here: chunked KDA (7755e858a) and its fp16 stage-3
# operands land after it on the branch and are NOT in it, because neither is bit for bit and the trained model's KL is
# still unmeasured -- the first real-pack box measures it, and shipping an unmeasured numerics change would contradict the
# same bar that refused byte recipe A for +5 %.
# 3d40ae99c is 765692590 and what came after on the same line (TORAD.md has each row), measured on the real pack on two
# RTX PRO 6000 Max-Q (rental 1, Oct 1, evidence.md): chunked KDA prefill (7755e858a) with its fp16 stage-3 operands
# (67275eacf), the hc post kernel a block a token with the next front's flat norm fused into it (fd5176e75), and MUL_MAT_ID's
# MMQ tile width from the columns an expert gets (647703131). Chunked KDA is the one numerics change. Its real-pack KLD
# against 765692590 (on 81aca7542, the same tree as this line before 647703131) is 0.011835 at 2k and 0.007412 at 16k, inside
# the engine's own batch-shape floor (765692590 against itself at -ub 512: 0.011509 and 0.006932; at -sm layer: 0.011627),
# so it ships on under the practical-equivalence gate: KLD at most 1.10x that floor at each depth, same top within 0.25 pt.
# The rest is bit for bit on the real pack: the legacy switches give KLD 0 against 765692590, and so does 647703131 with
# GGML_CUDA_KDA_CHUNKED_LEGACY=1. On the cards: pp32768 +6.0 % before 647703131, then 647703131 +21.4 % at pp4096 and
# +17.2 % at pp32768 over its own LEGACY switch; decode flat; served at n_max 2, 154.7 tok/s decode. The sparse gather's
# 32-head tile (258292bd8) and its switch-over (78a8e96b8) come after it and are not in it: the next rental measures them.
# 009073391 is 3d40ae99c and what came after on the same line (TORAD.md has each row), the v1 freeze: the sparse gather's
# 32-head tile (258292bd8) and its opt-in switch-over (78a8e96b8), the lightning indexer on octets of lanes (92690b613),
# the top-k prefilter behind penalties (c8fc02a36), a malformed UTF-8 byte read as U+FFFD (b915c5e6f), a sparse launch of
# a q8_0 K dequantizing only the cells it reads (24ba034fa), -ctki for the indexer's cache (d5fb3b1b8), routed IQ3_XXS
# experts at 9-16 tokens on the vector kernel (737ee4450), and MMQ's L2 prefetch of the next chunk's weights (0020175b4).
# Rental 2a ran its legs on 737ee4450's library (evidence.md): the q8_0 cache, three slots, and 737ee4450's own KLD at
# 0.919 to 0.978 of the gap MMQ already had. 0020175b4 reads the same logits to the printed digit, +6.15 % at pp512 and
# +3.52 % at pp4096, decode inside noise.
# 42f3b1be0 (fork main after PRs #87 and #88; TORAD.md has each row) is what moved it past 009073391: under -sm tensor one
# host thread launched a captured evaluation's replay on each card in turn, and a replay holding more work than a card's
# launch queue blocked it inside card 0's cudaGraphLaunch until card 1 reached the first all-reduce, which card 1 never
# did, its launch behind that thread. One perplexity chunk at -b 9 -ub 9 on two RTX PRO 6000 stopped at 8k and 16k on
# 0090733. e09841eff launches every other card from its own thread: 16k finishes, PPL 2.6523, and the KLD against 0090733
# is 0.000000 at 2k and 16k, at -ub 1024 and -ub 9. 471feb45d and 1b2c4f07a take that thread's wake off decode: tg64
# -0.03 % at depth 0 and -0.02 % at depth 16384 against the switch GGML_META_CAPTURE_THREADS=0, both intervals across
# zero. With them: 310ddcf8e (the internal all-reduce refuses CUDA_LAUNCH_BLOCKING=1, which hung it) and 12569c3b0
# (GGML_CUDA_COUNT_INFLIGHT, a diagnostic, off unless set). 37167fec9's in-flight bound is not in it. Served on rental 4
# (2x RTX PRO 6000, Oct 3) by rig's rendered np3 serve: three ~30K sessions leave 14,042 MiB free, the np3 stress and
# np1 tail repros pass, and served decode is 0.9990 of 009073391's (4 ABBA pairs, 95 % CI 0.9904 to 1.0076).
# Since Oct 4, 2026 this head serves engine.toml's own pin and its published build, and carries no [engine] of its own
# until a GLM change moves it past that pin again. The pin is 4131f11fc: 42f3b1be0 with a change to the PQ2_0
# tensor-core kernel only (fork PR #89), which this IQ3_XXS pack never runs.

[speculative]
type = "draft-mtp"             # the pack's own NextN block (glm5next.nextn_predict_layers = 1)
n_max = 2                      # as qualified; the validation rental measured 1-4 and 2 decodes fastest

[context]
model = 524288                 # the window served: half the trained 1,048,576, as qualified (a 436,077-token prompt answered)
advertise = 491520             # what one conversation is told it may use (15/16 of the window, bonsai's margin for the reply)

# The attention and indexer caches in q8_0, the recurrent state in the engine's own format. Measured on the real pack on two
# RTX PRO 6000 (rental 2a, Oct 2, evidence.md), against the f16 cache on the same library: KLD 0.011520 at 2k and 0.007469 at
# 16k, inside that f16 cache's own -ub 512 reordering (0.012685 and 0.012742), same top better at both; decode -0.68 % at
# d65536 and inside noise at d262144. Three slots share the pool with 14.2 GiB a card spare.
[cache]
k = "q8_0"
v = "q8_0"                     # under MLA absorption V is a view of the K cache, so it follows K
idx = "q8_0"                   # the DSA layers' lightning-indexer keys (-ctki, engine d5fb3b1b8)
# No [sizing]: the one profile is served as measured.

# Both cards of one kind, the model split across them. min_vram_mib: the validation rental's peak,
# 90,817 MiB on the second card, and a GiB of margin; only the 96 GB class clears it.
[[profiles]]
devices = 2
min_vram_mib = 92000
split = "tensor"               # 1.31x the layer split's served speed at n_max 2 (134.5 against 102.6 tok/s), its logits not separable from the layer split's own batch-shape floor (evidence.md)
slots = 3                      # one 524,288-cell pool shared under --kv-unified: 14,547 MiB a card spare under 4 sessions, and one session
                               # alone at 3 slots decodes 1.008x the one-slot speed, paired on the freeze library (evidence.md)
ctx = 524288
cuda_graphs = 0                # no cap: under -sm tensor the default cap of 8 evicts every graph before its reuse (evidence.md)

[runtime]
# how the pack is loaded; "assets/…" paths resolve against this head's directory
args = [
  "-b", "4096",
  "-ub", "1024",               # served under tensor: a 27,642-token prefill 16.1 s against 512's 20.9, 10 GB a card spare; 2048 does not fit (evidence.md)
  "--alias", "GLM-5.3-Flash-Uncensored-IQ3_XXS",
  "--chat-template-file", "assets/chat-template.jinja",
]
# no sampling flags: the engine reads the GGUF's own (general.sampling: temp 1.0, top_p 0.95, repeat penalty 1.1 over 256)

[client]                       # facts whatever sits in front of this head must know
rejects_reasoning_effort = false  # the template maps low and high, and anything else to max
slot_pinning = false              # the server picks a slot; pinning is unmeasured at 3 slots
any_model_id = true               # llama-server serves the loaded model for any model id
