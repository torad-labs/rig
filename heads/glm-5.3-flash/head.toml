# GLM-5.3 Flash Uncensored at IQ3_XXS, over two 96 GB cards. Everything rig knows about this model
# is here, as data: what to fetch, the engine commit that runs it, how it spans the cards, and the
# arguments the server is loaded with. The WHY behind each number is in evidence.md beside this file.
name = "glm-5.3-flash"
title = "GLM-5.3 Flash Uncensored (IQ3_XXS, 2 cards)"
port = 8102

